<body>
    <div class="topnav"> 
        <a href="#home" onclick="goToHome('course')">Kale</a>
        <a href="#settings" class="split">Settings</a>
    </div>
    <script>
        const chapters = {
                "topic00": {
                    "slides":[
                        { "number":0,"type":"exp","text":"<b>Rubrics</b><br><br>This is where your journey will begin.<br>Rubrics are an essential part of the evaluation system in MYP, and it is the key to getting higher grades. In fact, the top students in MYP all utilize these rubrics."},
                        { "number":1, "type":"mul","text":"Take a look at an example of a student's essay.<br><br>It approximately took ten thousand years to move from writing to printing press, but just another five hundred more to proceed to email; from this data, we can assume that our technology is advancing faster than ever before. As a topic, artificial intelligence is currently being developed by thousands of people for the purpose of making our lives easier and creating entertainment. On the other hand, Steven Hawking is worried that AI would spell the end of the human race if it were to think like humans. Although there are many opinions on AI, I believe it would be able to feel and think like humans, and also solve all of our problems.<br><br>Looking at this essay, give a grading from 1~5(1 being the lowest, 5 being the highest)", "mulOp":["1","2","3","4","5"],"mulAn":["Nice.","Nice.","Nice.","Nice.","Nice."]},
                        { "number":2, "type":"mul", "text":"Now that you’ve given a rating to the essay, what standard made you evaluate it that way?","mulOp":["Vocabulary","Grammar","The Content","Not Sure"],"mulAn":["Nice. Vocabulary is a good way to see ability.","Nice. Grammar is a good way to see achievement.","Good. Content is very important.","It’s essential to be conscious on how you are grading."] },
                        { "number":3, "type":"exp", "text":"When any exams, posters, essays, or reports are being evaluated in MYP, it is not being blindly decided or graded based on the teacher’s preference.<br><br>There is always a very specific and clear <b>rubric</b> that is used to give a student their mark." },
                        { "number":4, "type":"mul", "text":"Take a look at two student’s sentences. Which one would get a higher evaluation if the rubric was based on <b>vocabulary</b>?<br><br>Student A: This is a big dog.<br>Student B: This is an immense dog.","mulOp":["Student A","Student B"],"mulAn":["Hmm… immense is probably a more advanced word than big.","You’re right, the student uses more advanced vocabulary."] },
                        { "number":5, "type":"exp", "text":"In MYP, there is a diverse amount of rubrics for subjects, criteria, strands, and bands, which we will cover in later guides." },
                        { "number":6, "type":"exp", "text":"Before we get into anything specific, here is something you should know about the MYP rubrics.<br><br>They are always based on <b>absolute assessment</b>. This means your grade is not influenced by the performance of other students or your ranking in class, and is based purely on the achievement of yourself.<br><br>Also, all MYP gradings are out of an 8, which means 0 being the lowest, and 8 being the highest." }
                ]
                },
                "topic01": {
                    "slides":[
                        { "number":0, "type":"exp", "text":"<b>Subjects and Criteria</b><br><br>In this guide, we’ll go into the variety of rubrics which are essential for identifying which rubric you are tackling when working on an assignment."},
                        { "number":1, "type":"mul", "text":"How many “rubrics” do you think there are in MYP?", "mulOp":["Only 1","Maybe 20","Around 50","Over 100"],"mulAn":["That would be too little to do anything…","That’s close, but a little short.","That’s a pretty close number.","That would be a lot to handle…"]},
                        { "number":2, "type":"exp", "text":"In MYP, there are mainly 32 rubrics that can be used on an assignment.<br><br>There are 8 subjects, and each subject has 4 <b>criteria</b>.<br>8 times 4 is… 32.<br><br>Typically, there would be 1 or maybe 2 rubric per assignment, or assessment."},
                        { "number":3, "type":"exp", "text":"As said, there are 8 subjects in IB MYP. It will only be mentioned briefly for now, but it will be deeply explained in subject specific topics.<br><br><b>Language and Literature</b> - This is typically your first language. Reading literature, writing literature, analyzing literature, etc.<br><b>Language Acquisition</b> - This is a second language you would be learning such as English or Spanish.<br><b>Individuals and Societies</b> - This is basically social studies: history, geography, civics.<br>Sciences<b></b> - There would be fields such as chemistry, biology, and physics.<br><b>Mathematics</b> - Proofs, calculations, etc.<br><b>Arts</b> - Visual arts, theatre, music.<br><b>Physical and Health Education</b> - Sports and dance, as well as health knowledge.<br><b>Design</b> - It’s a subject of solving problems through craft and design."},
                        { "number":4, "type":"mul", "text":"Now, there are 4 <b>criteria</b> for each subject. They are named A, B, C, and well… D.<br><br>Why do you think it’s structured like this?","mulOp":["To track a balance of different skills","To stress students more"],"mulAn":["Yes, that’s an important part of MYP, and IB in general.","Probably not, as it is not written in the official curriculum."]},
                        { "number":5, "type":"exp", "text":"Instead of just measuring one skill, MYP grades multiple abilities to get a balanced achievement in that subject.<br><br>For example, <b>Language and Literature</b> consists of Listening(A), Reading(B), Speaking(C), and Writing(D).<br><br>Similarly, <b>Design</b> is constructed with Inquiring and Analyzing(A), Developing Ideas(B), Creating the Solution(C), and Evaluating(D)."},
                        { "number":6, "type":"exp", "text":"These criteria each get their own mark out of 8 on their respective assignment such as posters, exams, reports, presentations, etc.<br><br>The first step to improving grades in MYP, is to identify what <b>criteria</b> is the assignment being evaluated by.<br>For example, if there is an English essay assignment, that would most likely fall into English Criteria D. In most cases, the criteria is clearly mentioned in the assignment description."}
                    ]
                },
                "topic02": {
                    "slides":[
                        { "number":0, "type":"exp", "text":"<b>Strands and Bands</b><br><br>In this guide, we’ll go into the details of rubrics. More specifically, how MYP is being clear and definitive about their criteria description."},
                        { "number":1, "type":"exp", "text":"Let’s say you need to write an essay on your opinions with climate change, and the rubric only says this:<br>Criteria D: Vocabulary, Grammar, Structure, Content<br><br>Try writing a few sentences on paper.(You can skip this step if you want)"},
                        { "number":2, "type":"mul", "text":"How comfortable were you writing that essay, or at least being confident with getting a perfect 8?", "mulOp":["Not that much","Somewhat","I'm confident"], "mulAn":["Right, the rubric was extremely vague.","I mean it does have “grammar” and “content”, but that still doesn’t clarify what gets and 8.","WHAT!? I guess you’re pretty good at writing essays."]},
                        { "number":3, "type":"exp", "text":"In MYP, rubrics are very specific, in order to create an absolute standard amongst teachers who grade.<br>An example of an MYP rubric would look like this:<br><br><i>At the end of phase 4, students should be able to:<br>i. write and speak using a range of vocabulary, grammatical structures and conventions; when speaking, use clear pronunciation and intonation<br>ii. organize information and ideas into a structured text; use a wide range of cohesive devices<br>iii. use language to suit the context.</i><br><br>You can see that the criteria is being divided by roman numerals. These are called <b>strands</b>. Per criteria, there are typically 3 to 5 strands."},
                        { "number":4, "type":"exp", "text":"These <b>strands</b> are what makes the rubric criteria detailed. If you are still confused with the language used in the strands, it will be covered in the next guide.<br>Try writing another short essay with the same prompt, but this time with this rubric(You can skip this step if you want):<br><br>A student who achieves 7-8:<br>i. writes/speaks effectively using a range of vocabulary, grammatical structures and conventions accurately; occasional errors do not interfere with communication.<br>ii. organizes information and ideas clearly into a well-structured text; uses a range of cohesive devices accurately, adding clarity and coherence to the message<br>iii. uses language effectively to suit the context."},
                        { "number":5, "type":"exp", "text":"Did you notice how the strand mentioned “A student who achieves 7-8”?<br>MYP rubrics define the expected assignment quality of each grade level: 1-2, 3-4, 5-6, 7-8. These are called <b>bands</b><br><br>By the way, here’s what each <b>band</b> level is like:<br>1-2: Beginning, limited<br>3-4: Developing<br>5-6: Strong<br>7-8: Excellent"},
                        { "number":6, "type":"exp", "text":"Oh, here’s something else to mention about strands and bands.<br><br>s the student year goes up, the assignment expectations will follow.<br><br>There are three levels of the same criteria, for Year 1, 3, and 5. The higher year has a more advanced, difficult criteria."}
                    ]
                },
                "topic03": {
                    "slides":[
                        { "number":0, "type":"exp", "text":"<b>TSC and Command Terms</b><br><br>We’ve learned how the MYP rubrics are detailed and complete, but we actually need to figure out how to use the rubrics to score an 8 in assignments."},
                        { "number":1, "type":"exp", "text":"Let's start with an activity.<br><br>Here’s a strand from criteria C of mathematics.<br><br><i>ii. communicate coherent mathematical lines of reasoning</i><br><br>Explain the following calculation process based on the criteria:<br>(7+8)×6+3="},
                        { "number":2, "type":"exp", "text":"From that activity, how well do you think you performed based on the criteria?", "mulOp":["I'm pretty confident.","I'm not sure."], "mulAn":["Impressive, are you confident enough for an 8?","That’s totally fine. The rubric language is quite confusing."]},
                        { "number":3, "type":"exp", "text":"Let’s look back at the rubric.<br><br><i>iii. communicate coherent mathematical lines of reasoning</i><br><br>Earlier I did say it was specific and complete, but it is quite difficult actually interpreting the language and executing what is desired. It may seem easy at first, but to be honest, what is the difference between “explain” and “describe”."},
                        { "number":4, "type":"exp", "text":"This is something that many students face, and eventually give up on rubric understanding. In order to solve this, there are two hints in MYP: <br><b>Task-Specific Clarification(TSC)</b>, and <b>Command Terms</b>."},
                        { "number":5, "type":"exp", "text":"Task-Specific Clarification, is context that teachers give to students to advise what exactly to do in order to fulfill a specific strand.<br>For example, on a story writing assignment in language and literature criteria C, a teacher might do:<br><br>ii. make stylistic choices in terms of linguistic, literary and visual devices, demonstrating awareness of impact on an audience<br>→ Use techniques such as metaphors and similes"},
                        { "number":6, "type":"exp", "text":"This creates the translation from “<b>what</b> gets an 8” to “<b>how</b> to get an 8“, making the assignment straightforward."},
                        { "number":7, "type":"exp", "text":"Another method of this are <b>command terms</b>, which are contexts of the official definition of verbs that appear in rubrics.<br><br>For example, the definition of “explain” and “describe” are<br><br>explain: Give a detailed account including reasons or causes.<br>describe: Give a detailed account or picture of a situation, event, pattern or process.<br><br>This not only makes the words clear, but shows an idea of what to do in the assignment."},
                        { "number":8, "type":"exp", "text":"Now, try the activity again but this time with the two hints.<br><br><i>iii. communicate coherent mathematical lines of reasoning</i><br><b>→Break down the process, and give reasoning for why the calculation happens</b><br>communicate: <b>To give messages or information to others through writing</b><br><br>Explain the following calculation process based on the criteria:<br>(7+8)×6+3="},
                        { "number":9, "type":"exp", "text":"Furthermore, good methods for increasing grades is to look at exemplars. This means to observe real student work, and see how they got a high mark."},
                    ]
                },
                "topic04": {
                    "slides":[
                        { "number":0, "type":"exp", "text":"<b>Grading and Evalation</b><br><br>So far, we’ve discussed how to get high marks on MYP rubrics. For the last guide of the introduction, you will learn what assignments there are, how they are graded, and how it is lead to the final score."},
                        { "number":1, "type":"exp", "text":"To begin, there are 2 types of assignments in MYP. <b>Formative</b> and <b>Summative</b>."},
                        { "number":2, "type":"mul", "text":"Now, try grading the following conclusion of an essay based on Language Acquisition criteria D.<br><br><i>i. write and speak using a range of vocabulary, grammatical structures and conventions; when speaking, use clear pronunciation and intonation<br>ii. organize information and ideas into a structured text; use a wide range of cohesive devices<br>iii. use language to suit the context.</i><br><br>In conclusion, although McDonald’s is very worthy for people who suffer from poverty, there are still major consequences with fast food for the environment and even for us humans. Even if I would kind of miss some items on the menu if the company were to close down, I would be sure that the world would be a better place just like Eric Schlosser says, “Fast food is popular because it's convenient, it's cheap, and it tastes good. But the real cost of eating fast food never appears on the menu.” In the future, I want to become a computer scientist in order to prevent food waste by innovating more AI technology.", "mulOp":["1","2","3","4","5","6","7","8"], "mulAn":["Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6.","Good. An appropriate grade is around 5-6."]},
                        { "number":3, "type":"exp", "text":"Throughout the year, the student would do the assignment, and the teacher will mark it. As a result, there would be something like this for Sciences:<br><br>A:7　B:5　C:5　D:4<br><br>In MYP, teachers convert these grades into a final grade which is out of 7."},
                        { "number":4, "type":"mul", "text":"Try making a grade for the previous scores:<br><br>A:7　B:5　C:5　D:4", "mulOp":["1","2","3","4","5","6","7"], "mulAn":["Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5.","Excellent. An appropriate grade would be around 4~5."]},
                        { "number":5, "type":"exp", "text":"Do you remember when I said “Formative assessments indirectly influence final grades”? Well, there is something called the <b>best-fit approach</b> in MYP.<br><br>When deciding on the final grade, it is not something simple as:<br>“If the total of ABCD is over 20, its a 4”<br><br>It isn’t wrong, but the conversion is quite flexible."},
                        { "number":6, "type":"exp", "text":"Let’ say a student’s mark is<br><br>A:8　B:8　C:2　D:8<br><br>It would probably get around a 5~6 just by counting the total, but obviously C is very limited. Some teachers may grade it down, looking at the balance."},
                        { "number":7, "type":"exp", "text":"This is also where formative assessments come in play.<br>Teachers can check the criteria C formative assessment to see what the student really achieves.<br><br>Similarly, MYP also looks at growth. Throughout the few times the final grade is given, teachers may raise it up if the student shows growth and improvement overtime."},
                        { "number":8, "type":"exp", "text":"It is important to identify what the summative assessment is based on, and find a good balance to get decent grades."},
                    ]
                }
            
        }

        function feedback(topic) {
            const selectElement = document.getElementById('option-select')
            const selectedValue = selectElement.value
            const bruh = "topic"+topic[0]+topic[2]
            const array = chapters[bruh].slides[topic[4]].mulOp
            const index = array.indexOf(selectedValue)
            const feedback = chapters[bruh].slides[topic[4]].mulAn[index]

            const text = document.createElement('p')
            text.setAttribute("class","feedback-text")
            text.setAttribute("id","feedbackText")
            text.innerHTML = feedback
            document.body.appendChild(text)

            const chooseButton = document.querySelector("#chooseButton")
            chooseButton.setAttribute("disabled","true")
            const nextButton = document.querySelector("#nextButton")
            nextButton.removeAttribute("disabled")
        }

        function pageRender(topicNo) {
            if (topicNo[4]==0) {
                const bruh = "topic"+topicNo[0]+topicNo[2]
                const text = document.createElement('p')
                text.setAttribute("id","topicText")
                text.setAttribute("class","guide-text")
                text.innerHTML = chapters[bruh].slides[topicNo[4]].text
                document.body.appendChild(text)
            }   else {
                const text = document.getElementById("topicText")
                const bruh = "topic"+topicNo[0]+topicNo[2]
                text.innerHTML = chapters[bruh].slides[topicNo[4]].text
                if (chapters[bruh].slides[topicNo[4]].type == "mul") {
                    //Make the Next button inactive
                    const nextButton = document.querySelector("#nextButton")
                    nextButton.setAttribute("disabled","true")
                    //Options Dropdown
                    const label = document.createElement("label")
                    label.textContent = "Choose an option: "
                    label.setAttribute("for","option-select")
                    label.setAttribute("id","label")
                    label.setAttribute("class","label")

                    const select = document.createElement("select")
                    select.id = "option-select"
                    select.setAttribute("class","dropdown")

                    chapters[bruh].slides[topicNo[4]].mulOp.forEach(item => {
                        const option = document.createElement("option")
                        option.value = item
                        option.textContent = item
                        select.appendChild(option)
                    })

                    const container = document.body
                    container.appendChild(label)
                    container.appendChild(select)

                    //Choose Button
                    const myButton = document.createElement("button")
                    myButton.textContent = "Choose"
                    myButton.setAttribute("id","chooseButton")
                    myButton.setAttribute("class","choose-button")
                    myButton.setAttribute("onclick","feedback('"+topicNo+"')")
                    document.body.append(myButton)
                }
            }
        }

        function nextPage() {
            const bruh = "topic"+topicNo[0]+topicNo[2]
            const length = (chapters[bruh].slides).length

            if (chapters[bruh].slides[fixedTopicNo[4]].type == "mul") {
                const element1 = document.querySelector("#feedbackText")
                const element2 = document.querySelector("#chooseButton")
                const element3 = document.querySelector("#label")
                const element4 = document.querySelector("#option-select")

                element1.remove()
                element2.remove()
                element3.remove()
                element4.remove()
            }

            if (fixedTopicNo[4] == length-1) {
                alert("Topic Complete!")
                window.location.href ='home.html'
            } else {
                num = parseInt(fixedTopicNo[4],10)
                fixedTopicNo = fixedTopicNo.slice(0,4) + String(num+1)
                pageRender(fixedTopicNo)
            }
        }

        const topicNo = localStorage.getItem('topicNo')
        let fixedTopicNo = topicNo+"-0"
        pageRender(fixedTopicNo)
    </script>
    <script src="script.js"></script>
    <button id="nextButton" class="nextButton" onclick="nextPage()">Next</button>
</body>
</html>
